name: Bug Report
description: Report a reproducible bug or unexpected behaviour.
title: "[BUG]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        Please provide accurate information so maintainers can investigate the issue.

        **Do not include passwords, API keys, access tokens, or private information.**

  - type: input
    id: project_version
    attributes:
      label: Project Version
      description: Which version or commit are you using?
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - iOS
        - Web Browser
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly explain the problem.
      placeholder: Describe what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce the issue.
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Perform...
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages or Logs
      description: Include relevant logs after removing sensitive information.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Screenshots, references, or other useful details.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have removed sensitive information from this report.
          required: true
