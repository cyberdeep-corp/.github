name: Documentation Improvement
description: Report incorrect documentation or suggest improvements.
title: "[DOCS]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Good documentation makes software easier to understand and maintain.

        Help us improve our documentation by describing the issue or suggestion.

  - type: dropdown
    id: documentation_type
    attributes:
      label: Documentation Category
      options:
        - README
        - Installation Guide
        - Configuration Guide
        - API Documentation
        - Code Examples
        - Tutorials
        - Architecture Documentation
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Provide the file path or URL.
      placeholder: "README.md"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Current Documentation Issue
      description: Explain what is incorrect, missing, or unclear.
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Suggested Improvement
      description: Explain how the documentation could be improved.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Supporting References
      description: Add relevant examples, links, or references.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have checked for existing documentation issues.
          required: true
